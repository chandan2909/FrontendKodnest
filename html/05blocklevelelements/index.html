<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block level elements</title>
</head>
<body>
    <!-- 
    block level elements: The block level elements are the elements that take up the full width of the parent container and start on a new line.
    The block level elements are:
    <h1> to <h6>: The heading elements are used to define the headings of the document. The <h1> element is the most important heading and the <h6> element is the least important heading.</h1>
    <p>: The paragraph element is used to define a paragraph of text. The <p> element is a block level element and it takes up the full width of the parent container.
    <div>: The div element is used to group together other elements. The <div> element is a block level element and it takes up the full width of the parent container. The <div> element is often used to create a container for other elements and to apply styles to them.   
    <ul>: The unordered list element is used to define an unordered list of items. The <ul> element is a block level element and it takes up the full width of the parent container. The <ul> element is often used to create a list of items that are not in a specific order.
    <ol>: The ordered list element is used to define an ordered list of items. The <ol> element is a block level element and it takes up the full width of the parent container. The <ol> element is often used to create a list of items that are in a specific order.
    
    -->
 <!-- example -->
    <h1>Block level elements</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Fuga, voluptate.</p>
    <!-- 
    Inline elements: 
    The inline elements are the elements that do not take up the full width of the parent container and do not start on a new line. The inline elements are:
    <a>: The anchor element is used to define a hyperlink. The <a> element is an inline element and it does not take up the full width of the parent container. The <a> element is often used to create a link to another page or to a specific section of the same page.
    <span>: The span element is used to group together inline elements. The <span> element is an inline element and it does not take up the full width of the parent container. The <span> element is often used to apply styles to a specific section of text or to group together inline elements for styling purposes. 
    -->
        <!--Inline elements example -->
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Fuga, voluptate. <a href="#">Lorem ipsum dolor sit amet.</a> <span><b>Lorem</b> ipsum dolor sit amet consectetur adipisicing elit. Fuga, voluptate.</span></p>
    
</body>
</html>
